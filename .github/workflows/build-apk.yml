name: Build KayRail Mini APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "KayRailMini-android-source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          rm -rf unpacked
          mkdir unpacked
          unzip -q KayRailMini-android-source.zip -d unpacked
          ls -la unpacked/KayRailMini

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: unpacked/KayRailMini
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KayRailMini-APK
          path: unpacked/KayRailMini/app/build/outputs/apk/debug/app-debug.apk
